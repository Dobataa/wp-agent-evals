# Local sandbox: WordPress + MySQL + WP-CLI.
# Everything is reachable only from this machine (127.0.0.1).
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./sandbox/snapshots:/snapshots
      - ./sandbox/scripts:/scripts
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-p${DB_ROOT_PASSWORD}",
        ]
      interval: 5s
      retries: 20

  wordpress:
    image: wordpress:latest # needs WordPress 6.9+ for the Abilities API
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      # "local" lets application passwords work over plain HTTP on localhost
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes:
      - wp_data:/var/www/html
      - ./sandbox/wp-plugin:/var/www/html/wp-content/plugins/agent-eval-abilities

  wpcli:
    image: wordpress:cli
    depends_on:
      - wordpress
    user: "33:33" # same user as the wordpress container (www-data)
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - wp_data:/var/www/html
      - ./sandbox/wp-plugin:/var/www/html/wp-content/plugins/agent-eval-abilities
      - ./sandbox/scripts:/scripts
      - ./sandbox/snapshots:/snapshots
    entrypoint: ["wp"]
    command: ["--info"]

volumes:
  db_data:
  wp_data:
